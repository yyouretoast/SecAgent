[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secagent"
version = "0.1.0"
description = "Automated OWASP Security Scanner & GitHub Action for Autonomous AI Agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "SecAgent Team", email = "team@secagent.dev" }
]
keywords = [
    "ai-agents",
    "security-testing",
    "langgraph",
    "owasp",
    "opentelemetry",
    "devsecops",
    "github-actions"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.25.0",
    "typer>=0.29.2",
    "rich>=13.7.0",
    "pyyaml>=6.0.4",
    "pydantic>=2.14.4",
    "jsonschema>=4.22.0",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=1.2.24",
    "langchain-core>=1.8.4",
]
dashboard = [
    "streamlit>=1.35.0",
]
all = [
    "langgraph>=1.2.24",
    "langchain-core>=1.8.4",
    "streamlit>=1.35.0",
]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "mypy>=2.4.1",
    "streamlit>=1.35.0",
    "langgraph>=1.2.24",
    "langchain-core>=1.8.4",
]

[project.scripts]
secagent = "secagent.cli:app"

[project.urls]
Homepage = "https://github.com/yyouretoast/SecAgent"
Repository = "https://github.com/yyouretoast/SecAgent"
Issues = "https://github.com/yyouretoast/SecAgent/issues"
Documentation = "https://github.com/yyouretoast/SecAgent#readme"
Security = "https://github.com/yyouretoast/SecAgent/security/advisories"

[tool.hatch.build.targets.wheel]
packages = ["src/secagent"]

[tool.hatch.build.targets.wheel.force-include]
"policies/security_rules.yaml" = "secagent/policies/security_rules.yaml"
"schemas/trace_event.schema.json" = "secagent/schemas/trace_event.schema.json"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
