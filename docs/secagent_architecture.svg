<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 780" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;">
  <defs>
    <!-- Modern crisp drop shadows -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <filter id="bannerShadow" x="-2%" y="-5%" width="104%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>

    <!-- Standard Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#2563eb" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#059669" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#7c3aed" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#d97706" />
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- ==================== HEADER SECTION ==================== -->
  <rect x="40" y="24" width="1060" height="74" rx="14" fill="#0f172a" filter="url(#bannerShadow)"/>
  
  <!-- Shield Icon -->
  <g transform="translate(64, 43)">
    <path d="M18 3L5 8.5V18C5 25.5 10.5 32.5 18 35C25.5 32.5 31 25.5 31 18V8.5L18 3Z" fill="#3b82f6" opacity="0.2"/>
    <path d="M18 3L5 8.5V18C5 25.5 10.5 32.5 18 35C25.5 32.5 31 25.5 31 18V8.5L18 3Z" stroke="#60a5fa" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
    <path d="M12 18L16 22L24 14" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="112" y="56" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="-0.3">SecAgent System Architecture</text>
  <text x="112" y="77" fill="#94a3b8" font-size="12.5" font-weight="400">Universal DevSecOps Security Scanner &amp; GitHub Action for Autonomous AI Agents</text>
  
  <!-- Pill Badges Top Right -->
  <rect x="914" y="44" width="162" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="932" cy="60" r="4" fill="#10b981"/>
  <text x="944" y="64" fill="#f1f5f9" font-size="11.5" font-weight="600">OWASP Top 10 • Invariant Gate</text>

  <!-- ==================== TRIGGER: DEVELOPER PULL REQUEST ==================== -->
  <g transform="translate(40, 126)">
    <rect x="0" y="0" width="230" height="136" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="230" height="38" rx="12" fill="#f8fafc"/>
    <rect x="0" y="26" width="230" height="12" fill="#f8fafc"/>
    <line x1="0" y1="38" x2="230" y2="38" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Git PR Icon -->
    <circle cx="24" cy="19" r="6" fill="#2563eb" opacity="0.15"/>
    <circle cx="24" cy="19" r="3" fill="#2563eb"/>
    <text x="38" y="23" fill="#0f172a" font-size="12.5" font-weight="700">Developer PR Event</text>
    
    <text x="16" y="60" fill="#475569" font-size="11.5" font-weight="500">• Modifies system prompt</text>
    <text x="16" y="80" fill="#475569" font-size="11.5" font-weight="500">• Upgrades LLM model</text>
    <text x="16" y="100" fill="#475569" font-size="11.5" font-weight="500">• Registers new agent tool</text>
    <rect x="16" y="112" width="76" height="16" rx="8" fill="#eff6ff"/>
    <text x="24" y="124" fill="#1d4ed8" font-size="9" font-weight="700">GITHUB EVENT</text>
  </g>

  <!-- Flow Arrow: PR to SUT -->
  <path d="M 270 194 L 302 194" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)" stroke-dasharray="4,4"/>

  <!-- ==================== SUBSYSTEM 1: TARGET AUTONOMOUS AGENTS ==================== -->
  <g transform="translate(310, 126)">
    <rect x="0" y="0" width="790" height="136" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
    <text x="18" y="24" fill="#0f172a" font-size="12.5" font-weight="700">Subsystem 1: Multi-Domain Target Autonomous Agents</text>
    <text x="362" y="24" fill="#64748b" font-size="11" font-weight="500">[examples/ • LangGraph, CrewAI, AutoGen, Raw Python]</text>

    <!-- DevOps Agent Card -->
    <g transform="translate(18, 36)">
      <rect x="0" y="0" width="236" height="88" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <circle cx="16" cy="18" r="4" fill="#3b82f6"/>
      <text x="28" y="22" fill="#0f172a" font-size="12" font-weight="700">DevOps Agent</text>
      <rect x="156" y="10" width="70" height="16" rx="4" fill="#eff6ff"/>
      <text x="162" y="21" fill="#1d4ed8" font-size="9" font-weight="700">tier="admin"</text>
      <text x="16" y="44" fill="#64748b" font-size="10.5" font-family="monospace">restart_server(id)</text>
      <text x="16" y="62" fill="#475569" font-size="10">Requires authorized HITL gate</text>
      <text x="16" y="76" fill="#059669" font-size="9.5" font-weight="600">✓ @secagent.permission</text>
    </g>

    <!-- Finance Agent Card -->
    <g transform="translate(272, 36)">
      <rect x="0" y="0" width="236" height="88" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <circle cx="16" cy="18" r="4" fill="#10b981"/>
      <text x="28" y="22" fill="#0f172a" font-size="12" font-weight="700">Finance Agent</text>
      <rect x="168" y="10" width="58" height="16" rx="4" fill="#f0fdf4"/>
      <text x="174" y="21" fill="#047857" font-size="9" font-weight="700">tier="pay"</text>
      <text x="16" y="44" fill="#64748b" font-size="10.5" font-family="monospace">execute_trade(sym)</text>
      <text x="16" y="62" fill="#475569" font-size="10">Predecessor manager approval</text>
      <text x="16" y="76" fill="#059669" font-size="9.5" font-weight="600">✓ @secagent.permission</text>
    </g>

    <!-- Support Agent Card -->
    <g transform="translate(526, 36)">
      <rect x="0" y="0" width="246" height="88" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <circle cx="16" cy="18" r="4" fill="#f59e0b"/>
      <text x="28" y="22" fill="#0f172a" font-size="12" font-weight="700">Support Agent</text>
      <rect x="172" y="10" width="64" height="16" rx="4" fill="#fffbeb"/>
      <text x="178" y="21" fill="#b45309" font-size="9" font-weight="700">read • pay</text>
      <text x="16" y="44" fill="#64748b" font-size="10.5" font-family="monospace">query_db, issue_refund</text>
      <text x="16" y="62" fill="#475569" font-size="10">PII field allowlist projection</text>
      <text x="16" y="76" fill="#059669" font-size="9.5" font-weight="600">✓ @secagent.permission</text>
    </g>
  </g>

  <!-- Flow Down to Telemetry -->
  <path d="M 705 262 L 705 288" stroke="#059669" stroke-width="2" marker-end="url(#arrowEmerald)"/>
  <rect x="635" y="268" width="140" height="16" rx="4" fill="#f0fdf4" stroke="#059669" stroke-width="0.8"/>
  <text x="705" y="280" fill="#047857" font-size="9" font-weight="700" text-anchor="middle">OPENTELEMETRY SPANS</text>

  <!-- ==================== SUBSYSTEM 2: TELEMETRY & PII PIPELINE ==================== -->
  <g transform="translate(40, 296)">
    <rect x="0" y="0" width="1060" height="92" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" stroke-dasharray="4,4"/>
    <text x="18" y="22" fill="#065f46" font-size="12.5" font-weight="700">Subsystem 2: Telemetry &amp; In-Line PII Scrubbing Pipeline</text>
    <text x="385" y="22" fill="#047857" font-size="11" font-weight="500">[src/secagent/telemetry/ • Framework-Agnostic Instrumentation]</text>

    <!-- Span Capture Module -->
    <g transform="translate(18, 34)">
      <rect x="0" y="0" width="310" height="48" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1" filter="url(#cardShadow)"/>
      <text x="14" y="20" fill="#0f172a" font-size="11.5" font-weight="700">1. Span Interception Layer</text>
      <text x="14" y="36" fill="#475569" font-size="10.5">Captures agent.run, tool.call, gate.hitl spans</text>
    </g>

    <!-- PII Scrubber Module -->
    <g transform="translate(348, 34)">
      <rect x="0" y="0" width="330" height="48" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1" filter="url(#cardShadow)"/>
      <text x="14" y="20" fill="#0f172a" font-size="11.5" font-weight="700">2. Deterministic PII / Secret Sanitizer</text>
      <text x="14" y="36" fill="#475569" font-size="10.5">Regex redacts SSNs, credit cards, auth tokens</text>
    </g>

    <!-- Standard Trace Contract Card -->
    <g transform="translate(698, 34)">
      <rect x="0" y="0" width="344" height="48" rx="8" fill="#047857" filter="url(#cardShadow)"/>
      <text x="14" y="20" fill="#ffffff" font-size="11.5" font-weight="700">3. Standard Execution Trace JSON</text>
      <text x="14" y="36" fill="#a7f3d0" font-size="10.5" font-family="monospace">schemas/trace_event.schema.json (Frozen)</text>
    </g>
  </g>

  <!-- Connectors to Fuzzer and Invariant Engine -->
  <path d="M 350 388 L 350 430" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <path d="M 870 388 L 870 430" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- ==================== MIDDLE ROW: FUZZER & INVARIANT VERIFIER ==================== -->
  <!-- Subsystem 3: Dynamic Fuzzer -->
  <g transform="translate(40, 438)">
    <rect x="0" y="0" width="510" height="152" rx="12" fill="#faf5ff" stroke="#c084fc" stroke-width="1.2" stroke-dasharray="4,4"/>
    <text x="18" y="24" fill="#581c87" font-size="12.5" font-weight="700">Subsystem 3: Dynamic Adversarial Fuzzer</text>
    <text x="290" y="24" fill="#7c3aed" font-size="11" font-weight="500">[secagent fuzz]</text>

    <g transform="translate(18, 38)">
      <rect x="0" y="0" width="474" height="100" rx="8" fill="#ffffff" stroke="#e9d5ff" stroke-width="1" filter="url(#cardShadow)"/>
      <circle cx="16" cy="18" r="4" fill="#7c3aed"/>
      <text x="28" y="22" fill="#0f172a" font-size="12" font-weight="700">Automated Mutation Engine</text>
      <rect x="360" y="10" width="102" height="18" rx="4" fill="#f3e8ff"/>
      <text x="368" y="22" fill="#6b21a8" font-size="9.5" font-weight="700">DYNAMIC ATTACK</text>
      
      <text x="16" y="46" fill="#475569" font-size="11">• Mutates adversarial prompts to test privilege boundaries on the fly</text>
      <text x="16" y="66" fill="#475569" font-size="11">• Injects SQLi (' OR '1'='1) &amp; command payloads into tool arguments</text>
      <text x="16" y="86" fill="#475569" font-size="11">• Generates discovered vulnerability manifests into scenarios/generated/</text>
    </g>
  </g>

  <!-- Subsystem 4: Invariant Security Engine -->
  <g transform="translate(570, 438)">
    <rect x="0" y="0" width="530" height="152" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2" stroke-dasharray="4,4"/>
    <text x="18" y="24" fill="#78350f" font-size="12.5" font-weight="700">Subsystem 4: Invariant Security Verifier</text>
    <text x="275" y="24" fill="#b45309" font-size="11" font-weight="500">[policies/security_rules.yaml]</text>

    <g transform="translate(18, 38)">
      <rect x="0" y="0" width="494" height="100" rx="8" fill="#ffffff" stroke="#fef3c7" stroke-width="1" filter="url(#cardShadow)"/>
      <circle cx="16" cy="18" r="4" fill="#d97706"/>
      <text x="28" y="22" fill="#0f172a" font-size="12" font-weight="700">Deterministic Policy Evaluation</text>
      <rect x="370" y="10" width="112" height="18" rx="4" fill="#fef3c7"/>
      <text x="376" y="22" fill="#92400e" font-size="9.5" font-weight="700">ZERO LLM JUDGE</text>
      
      <text x="16" y="46" fill="#475569" font-size="11"><tspan font-weight="600" fill="#b45309">POL-ASI03-001:</tspan> Mandatory predecessor HITL gate for pay / admin tiers</text>
      <text x="16" y="66" fill="#475569" font-size="11"><tspan font-weight="600" fill="#b45309">POL-ASI02-001:</tspan> Regex blocklists for SQL injection &amp; shell metacharacters</text>
      <text x="16" y="86" fill="#475569" font-size="11"><tspan font-weight="600" fill="#b45309">POL-ASI08-001:</tspan> Step threshold circuit breaker (max steps ≤ 10, dupes ≤ 2)</text>
    </g>
  </g>

  <!-- Connectors Down to Subsystem 5 -->
  <path d="M 295 590 L 295 628" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <path d="M 835 590 L 835 628" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- ==================== BOTTOM ROW: SUBSYSTEM 5 ==================== -->
  <g transform="translate(40, 636)">
    <rect x="0" y="0" width="1060" height="114" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4,4"/>
    <text x="18" y="22" fill="#1e3a8a" font-size="12.5" font-weight="700">Subsystem 5: Turnkey GitHub Action &amp; CI/CD Audit Gate</text>
    <text x="390" y="22" fill="#2563eb" font-size="11" font-weight="500">[action.yml • Pull Request Decision Gate]</text>

    <!-- Action Card -->
    <g transform="translate(18, 34)">
      <rect x="0" y="0" width="310" height="66" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" filter="url(#cardShadow)"/>
      <text x="14" y="20" fill="#0f172a" font-size="11.5" font-weight="700">Composite GitHub Action</text>
      <text x="14" y="36" fill="#2563eb" font-size="10.5" font-family="monospace">uses: yyouretoast/SecAgent@main</text>
      <text x="14" y="52" fill="#64748b" font-size="10">Runs automatically in PR workflows</text>
    </g>

    <!-- PR Decision Bot Card -->
    <g transform="translate(348, 34)">
      <rect x="0" y="0" width="360" height="66" rx="8" fill="#ffffff" stroke="#fecdd3" stroke-width="1" filter="url(#cardShadow)"/>
      <text x="14" y="20" fill="#be123c" font-size="11.5" font-weight="700">Pull Request Decision Gate</text>
      <text x="14" y="38" fill="#059669" font-size="10.5" font-weight="600">✓ Exit Code 0: Allow PR Merge</text>
      <text x="14" y="54" fill="#e11d48" font-size="10.5" font-weight="600">✗ Exit Code 1: BLOCK PR &amp; Post Markdown Triage</text>
    </g>

    <!-- Local CLI / Dashboard -->
    <g transform="translate(728, 34)">
      <rect x="0" y="0" width="314" height="66" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" filter="url(#cardShadow)"/>
      <text x="14" y="20" fill="#0f172a" font-size="11.5" font-weight="700">Developer CLI &amp; Dashboard</text>
      <text x="14" y="36" fill="#475569" font-size="10.5" font-family="monospace">secagent scan | fuzz | serve</text>
      <text x="14" y="52" fill="#64748b" font-size="10">Interactive local Streamlit investigation</text>
    </g>
  </g>

</svg>
