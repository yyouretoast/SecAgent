<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1040" height="70" rx="12" fill="url(#headerGrad)"/>
  <text x="60" y="52" fill="#ffffff" font-size="22" font-weight="bold" letter-spacing="0.5">SecAgent System Architecture</text>
  <text x="60" y="74" fill="#bfdbfe" font-size="13">Universal CI/CD Security Scanner &amp; GitHub Action for Autonomous AI Agents</text>
  <rect x="880" y="38" width="165" height="32" rx="16" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="962" y="59" fill="#93c5fd" font-size="12" font-weight="600" text-anchor="middle">v2.0 • Zero-Diff</text>

  <!-- Developer PR Trigger -->
  <rect x="420" y="115" width="260" height="48" rx="8" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <text x="550" y="144" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">⚡ Pull Request / Agent Update</text>

  <!-- Downward arrow to SUT -->
  <path d="M 550 163 L 550 190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,4"/>

  <!-- Subsystem 1: Multi-Domain SUT -->
  <rect x="30" y="195" width="1040" height="135" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="50" y="210" width="260" height="26" rx="6" fill="#1d4ed8"/>
  <text x="60" y="228" fill="#ffffff" font-size="12" font-weight="bold">SUBSYSTEM 1: TARGET AGENTS (examples/)</text>
  
  <!-- SUT Modules -->
  <rect x="50" y="248" width="310" height="66" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="65" y="272" fill="#38bdf8" font-size="13" font-weight="bold">DevOps Agent</text>
  <text x="65" y="292" fill="#94a3b8" font-size="11">restart_server() • @permission(tier="admin")</text>

  <rect x="395" y="248" width="310" height="66" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="410" y="272" fill="#34d399" font-size="13" font-weight="bold">Finance Agent</text>
  <text x="410" y="292" fill="#94a3b8" font-size="11">execute_trade() • @permission(tier="pay")</text>

  <rect x="740" y="248" width="310" height="66" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="755" y="272" fill="#fbbf24" font-size="13" font-weight="bold">Support Agent</text>
  <text x="755" y="292" fill="#94a3b8" font-size="11">query_db() [read] • issue_refund() [pay]</text>

  <!-- Flow to Telemetry -->
  <path d="M 550 330 L 550 360" stroke="#60a5fa" stroke-width="2.5"/>
  <rect x="440" y="338" width="220" height="20" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="550" y="352" fill="#93c5fd" font-size="10" font-weight="600" text-anchor="middle">OpenTelemetry GenAI Spans</text>

  <!-- Subsystem 2: Telemetry & PII Pipeline -->
  <rect x="30" y="365" width="1040" height="70" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="50" y="380" width="310" height="26" rx="6" fill="#047857"/>
  <text x="60" y="398" fill="#ffffff" font-size="12" font-weight="bold">SUBSYSTEM 2: TELEMETRY &amp; PII SCRUBBER</text>
  <text x="390" y="405" fill="#e2e8f0" font-size="12">OTel Spans (agent.run, tool.call, gate.hitl) ➔ In-line Regex PII Redaction ➔ Standard Trace JSON</text>
  <text x="390" y="422" fill="#6ee7b7" font-size="11" font-weight="600">Contract: schemas/trace_event.schema.json</text>

  <!-- Connector branches to Fuzzer and Engine -->
  <path d="M 300 435 L 300 465" stroke="#a855f7" stroke-width="2"/>
  <path d="M 800 435 L 800 465" stroke="#f59e0b" stroke-width="2"/>

  <!-- Subsystem 3: Dynamic Fuzzer -->
  <rect x="30" y="465" width="490" height="100" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="50" y="480" width="280" height="26" rx="6" fill="#7e22ce"/>
  <text x="60" y="498" fill="#ffffff" font-size="12" font-weight="bold">SUBSYSTEM 3: ADVERSARIAL FUZZER</text>
  <text x="50" y="525" fill="#e2e8f0" font-size="12">• Dynamic Prompt Mutations (secagent fuzz)</text>
  <text x="50" y="545" fill="#d8b4fe" font-size="11">• Injects SQLi, jailbreak overrides, and retry loops on the fly</text>

  <!-- Subsystem 4: Invariant Security Engine -->
  <rect x="560" y="465" width="510" height="100" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="580" y="480" width="310" height="26" rx="6" fill="#b45309"/>
  <text x="590" y="498" fill="#ffffff" font-size="12" font-weight="bold">SUBSYSTEM 4: INVARIANT SECURITY ENGINE</text>
  <text x="580" y="525" fill="#e2e8f0" font-size="12">• Deterministic Policy Verifier (policies/security_rules.yaml)</text>
  <text x="580" y="545" fill="#fde68a" font-size="11">• ASI03 Predecessor Gates • ASI02 Regex SQLi • ASI08 Loops</text>

  <!-- Convergence to Subsystem 5 -->
  <path d="M 275 565 L 275 585 L 550 585" stroke="#a855f7" stroke-width="2"/>
  <path d="M 815 565 L 815 585 L 550 585" stroke="#f59e0b" stroke-width="2"/>
  <path d="M 550 585 L 550 600" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Subsystem 5: GitHub Action & CI/CD Gate -->
  <rect x="30" y="600" width="1040" height="65" rx="12" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="50" y="615" width="310" height="26" rx="6" fill="#0369a1"/>
  <text x="60" y="633" fill="#ffffff" font-size="12" font-weight="bold">SUBSYSTEM 5: GITHUB ACTION &amp; CI/CD GATE</text>
  <text x="390" y="632" fill="#f8fafc" font-size="12" font-weight="600">action.yml ➔ Exit Code 0 (Merge PR) | Exit Code 1 (Block PR &amp; Post Diagnostic Comment)</text>
  <text x="390" y="649" fill="#7dd3fc" font-size="11">Local Viewer: secagent serve (Streamlit Dashboard)</text>

</svg>
