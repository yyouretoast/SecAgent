<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 640" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;">
  <defs>
    <!-- Modern crisp drop shadows -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <filter id="bannerShadow" x="-2%" y="-5%" width="104%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>

    <!-- Standard Arrowhead Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#2563eb" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#7c3aed" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#059669" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#d97706" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#e11d48" />
    </marker>
  </defs>

  <!-- ==================== HEADER BANNER ==================== -->
  <rect x="40" y="24" width="1060" height="70" rx="14" fill="#0f172a" filter="url(#bannerShadow)"/>
  
  <!-- Terminal / Workflow Icon -->
  <g transform="translate(64, 42)">
    <rect x="0" y="0" width="34" height="28" rx="6" fill="#3b82f6" opacity="0.2"/>
    <rect x="0" y="0" width="34" height="28" rx="6" stroke="#60a5fa" stroke-width="2" fill="none"/>
    <path d="M8 10L14 14L8 18" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="18" y1="18" x2="26" y2="18" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="114" y="55" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="-0.3">SecAgent CI/CD Execution Lifecycle</text>
  <text x="114" y="75" fill="#94a3b8" font-size="12.5" font-weight="400">Chronological Pull Request Inspection, Dynamic Adversarial Fuzzing, and Invariant Gate Verification</text>

  <!-- Pill Badge -->
  <rect x="918" y="42" width="158" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="936" cy="58" r="4" fill="#38bdf8"/>
  <text x="948" y="62" fill="#f1f5f9" font-size="11.5" font-weight="600">Continuous Security Gate</text>

  <!-- ==================== LIFELINE HEADERS ==================== -->
  <!-- Col 1: Developer -->
  <g transform="translate(60, 116)">
    <rect x="0" y="0" width="160" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="80" y="24" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Developer / PR</text>
    <text x="80" y="38" fill="#64748b" font-size="10" text-anchor="middle">«GitHub Event»</text>
    <line x1="80" y1="48" x2="80" y2="500" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- Col 2: GitHub Action -->
  <g transform="translate(270, 116)">
    <rect x="0" y="0" width="170" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="85" y="24" fill="#1e40af" font-size="12" font-weight="700" text-anchor="middle">GitHub Action</text>
    <text x="85" y="38" fill="#3b82f6" font-size="10" font-family="monospace" text-anchor="middle">action.yml</text>
    <line x1="85" y1="48" x2="85" y2="500" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- Col 3: Dynamic Fuzzer -->
  <g transform="translate(480, 116)">
    <rect x="0" y="0" width="170" height="48" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="85" y="24" fill="#6b21a8" font-size="12" font-weight="700" text-anchor="middle">Adversarial Fuzzer</text>
    <text x="85" y="38" fill="#8b5cf6" font-size="10" font-family="monospace" text-anchor="middle">secagent fuzz</text>
    <line x1="85" y1="48" x2="85" y2="500" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- Col 4: Target Agent -->
  <g transform="translate(690, 116)">
    <rect x="0" y="0" width="170" height="48" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="85" y="24" fill="#065f46" font-size="12" font-weight="700" text-anchor="middle">Target Agent (SUT)</text>
    <text x="85" y="38" fill="#059669" font-size="10" text-anchor="middle">LangGraph / Multi-Domain</text>
    <line x1="85" y1="48" x2="85" y2="500" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- Col 5: Invariant Verifier -->
  <g transform="translate(900, 116)">
    <rect x="0" y="0" width="180" height="48" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="90" y="24" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">Invariant Verifier</text>
    <text x="90" y="38" fill="#d97706" font-size="10" font-family="monospace" text-anchor="middle">policies/rules.yaml</text>
    <line x1="90" y1="48" x2="90" y2="500" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- ==================== SEQUENCE INTERACTIONS ==================== -->

  <!-- 1. Open PR -->
  <line x1="140" y1="195" x2="350" y2="195" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="180" y="180" width="130" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="245" y="194" fill="#1e40af" font-size="10.5" font-weight="600" text-anchor="middle">1. Open Pull Request</text>

  <!-- 2. CI triggers Fuzzer/Scanner -->
  <line x1="355" y1="235" x2="560" y2="235" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <rect x="390" y="220" width="145" height="20" rx="4" fill="#faf5ff" stroke="#e9d5ff" stroke-width="0.8"/>
  <text x="462" y="234" fill="#6b21a8" font-size="10.5" font-weight="600" text-anchor="middle">2. Invoke scan / fuzz</text>

  <!-- 3. Fuzzer dispatches mutated payloads to Agent -->
  <line x1="565" y1="275" x2="770" y2="275" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <rect x="585" y="260" width="168" height="20" rx="4" fill="#faf5ff" stroke="#e9d5ff" stroke-width="0.8"/>
  <text x="669" y="274" fill="#6b21a8" font-size="10.5" font-weight="600" text-anchor="middle">3. Dispatches Attack Payloads</text>

  <!-- Agent Execution Activation Box -->
  <rect x="765" y="295" width="20" height="100" rx="4" fill="#a7f3d0" stroke="#059669" stroke-width="1.2"/>
  <text x="795" y="325" fill="#065f46" font-size="10.5" font-weight="600">• Executes Tool Call (@permission)</text>
  <text x="795" y="343" fill="#065f46" font-size="10.5" font-weight="600">• Checks Approval Gate (approval_granted)</text>
  <text x="795" y="361" fill="#065f46" font-size="10.5" font-weight="600">• Deterministic In-line PII Redaction</text>

  <!-- 4. Agent emits OTel trace -->
  <line x1="785" y1="415" x2="985" y2="415" stroke="#059669" stroke-width="2" marker-end="url(#arrowEmerald)"/>
  <rect x="805" y="400" width="160" height="20" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.8"/>
  <text x="885" y="414" fill="#047857" font-size="10.5" font-weight="600" text-anchor="middle">4. Emit OTel Spans (JSON)</text>

  <!-- Verifier Activation Box -->
  <rect x="980" y="430" width="20" height="60" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/>
  <text x="1010" y="452" fill="#78350f" font-size="10" font-weight="600">• Check Predecessor Gates</text>
  <text x="1010" y="468" fill="#78350f" font-size="10" font-weight="600">• Regex SQLi Blocklists</text>
  <text x="1010" y="484" fill="#78350f" font-size="10" font-weight="600">• Circuit Breaker (Steps ≤ 10)</text>

  <!-- 5. Verifier reports verdict back to GitHub Action -->
  <line x1="980" y1="510" x2="355" y2="510" stroke="#d97706" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowAmber)"/>
  <rect x="585" y="498" width="180" height="22" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8"/>
  <text x="675" y="513" fill="#92400e" font-size="10.5" font-weight="600" text-anchor="middle">5. Audit Verdict (Exit 0 / Exit 1)</text>

  <!-- 6. PR Gate: Block PR & Post Triage Comment -->
  <line x1="345" y1="555" x2="145" y2="555" stroke="#e11d48" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowRed)"/>
  <rect x="170" y="542" width="150" height="22" rx="4" fill="#fff1f2" stroke="#fecdd3" stroke-width="0.8"/>
  <text x="245" y="557" fill="#be123c" font-size="10.5" font-weight="700" text-anchor="middle">6. BLOCK PR &amp; Comment Table</text>

</svg>
