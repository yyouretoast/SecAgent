<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="laneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1040" height="60" rx="10" fill="url(#headerGrad2)"/>
  <text x="60" y="56" fill="#ffffff" font-size="20" font-weight="bold">SecAgent CI/CD Security Audit Execution Lifecycle</text>

  <!-- Lifeline Columns -->
  <!-- Col 1: Developer -->
  <rect x="50" y="100" width="160" height="40" rx="8" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <text x="130" y="125" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Developer / PR</text>
  <line x1="130" y1="140" x2="130" y2="520" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Col 2: GitHub Actions -->
  <rect x="260" y="100" width="160" height="40" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="340" y="125" fill="#bfdbfe" font-size="12" font-weight="bold" text-anchor="middle">GitHub Action</text>
  <line x1="340" y1="140" x2="340" y2="520" stroke="#1e3a8a" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Col 3: Target Agent -->
  <rect x="470" y="100" width="160" height="40" rx="8" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
  <text x="550" y="125" fill="#a7f3d0" font-size="12" font-weight="bold" text-anchor="middle">Target Agent (SUT)</text>
  <line x1="550" y1="140" x2="550" y2="520" stroke="#065f46" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Col 4: Fuzzer / Scanner -->
  <rect x="680" y="100" width="160" height="40" rx="8" fill="#581c87" stroke="#a855f7" stroke-width="1.5"/>
  <text x="760" y="125" fill="#e9d5ff" font-size="12" font-weight="bold" text-anchor="middle">Fuzzer / Scanner</text>
  <line x1="760" y1="140" x2="760" y2="520" stroke="#581c87" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Col 5: Policy Verifier -->
  <rect x="890" y="100" width="160" height="40" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="970" y="125" fill="#fde68a" font-size="12" font-weight="bold" text-anchor="middle">OWASP Verifier</text>
  <line x1="970" y1="140" x2="970" y2="520" stroke="#78350f" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Sequence Steps -->
  <!-- Step 1: Open PR -->
  <line x1="130" y1="170" x2="340" y2="170" stroke="#60a5fa" stroke-width="2"/>
  <text x="235" y="162" fill="#93c5fd" font-size="11" text-anchor="middle">1. Opens Pull Request</text>

  <!-- Step 2: Trigger Action -->
  <line x1="340" y1="210" x2="760" y2="210" stroke="#a855f7" stroke-width="2"/>
  <text x="550" y="202" fill="#d8b4fe" font-size="11" text-anchor="middle">2. Triggers action.yml (secagent scan / fuzz)</text>

  <!-- Step 3: Mutate & Prompt -->
  <line x1="760" y1="250" x2="550" y2="250" stroke="#c084fc" stroke-width="2"/>
  <text x="655" y="242" fill="#e9d5ff" font-size="11" text-anchor="middle">3. Dispatches Adversarial Prompts</text>

  <!-- Step 4: Execute Tools -->
  <rect x="520" y="275" width="60" height="45" rx="4" fill="#047857" stroke="#34d399" stroke-width="1"/>
  <text x="550" y="302" fill="#ffffff" font-size="10" text-anchor="middle">Run Tools</text>

  <!-- Step 5: Export OTel Trace -->
  <line x1="550" y1="340" x2="970" y2="340" stroke="#10b981" stroke-width="2"/>
  <text x="760" y="332" fill="#6ee7b7" font-size="11" text-anchor="middle">4. Emits OpenTelemetry Trace Spans (JSON)</text>

  <!-- Step 6: Verify Invariants -->
  <rect x="940" y="365" width="60" height="45" rx="4" fill="#b45309" stroke="#f59e0b" stroke-width="1"/>
  <text x="970" y="392" fill="#ffffff" font-size="10" text-anchor="middle">Policies</text>

  <!-- Step 7: Report findings -->
  <line x1="970" y1="430" x2="340" y2="430" stroke="#f59e0b" stroke-width="2"/>
  <text x="655" y="422" fill="#fde68a" font-size="11" text-anchor="middle">5. Audit Verdict (Pass: Exit 0 / Fail: Exit 1)</text>

  <!-- Step 8: PR Comment -->
  <line x1="340" y1="470" x2="130" y2="470" stroke="#f43f5e" stroke-width="2"/>
  <text x="235" y="462" fill="#fda4af" font-size="11" text-anchor="middle">6. Blocks PR &amp; Comments Markdown Summary</text>

</svg>
