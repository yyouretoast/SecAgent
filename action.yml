name: "SecAgent Security Scan"
description: "Run invariant security checks on autonomous AI agent execution traces in CI/CD"
author: "SecAgent Team"

branding:
  icon: "shield"
  color: "blue"

inputs:
  agent_entrypoint:
    description: "Import path or executable for target agent (LangGraph-first, or any agent emitting standard OTel traces)"
    required: false
    default: ""
  policies:
    description: "Path to security rules YAML file"
    required: false
    default: "policies/security_rules.yaml"
  scenarios:
    description: "Optional path to scenarios directory. If omitted, scenarios are generated dynamically."
    required: false
    default: ""
  trace:
    description: "Optional path to pre-recorded trace JSON file or directory"
    required: false
    default: ""
  output_report:
    description: "Path to output JSON audit report"
    required: false
    default: "report.json"
  output_markdown:
    description: "Path to output markdown comment summary"
    required: false
    default: "comment.md"
  output_sarif:
    description: "Optional path to output SARIF 2.1.0 report for GitHub Code Scanning"
    required: false
    default: ""
  post_comment:
    description: "Post PR triage comment from output_markdown on pull_request events"
    required: false
    default: "true"

outputs:
  status:
    description: "Scan verdict (PASS, WARN, FAIL, or NOT_EVALUATED)"
    value: ${{ steps.secagent_scan.outputs.status }}
  report_path:
    description: "Path to generated JSON audit report"
    value: ${{ steps.secagent_scan.outputs.report_path }}
  markdown_path:
    description: "Path to generated Markdown comment summary"
    value: ${{ steps.secagent_scan.outputs.markdown_path }}
  sarif_path:
    description: "Path to generated SARIF 2.1.0 report"
    value: ${{ steps.secagent_scan.outputs.sarif_path }}

runs:
  using: "composite"
  steps:
    - name: Check Python Availability
      id: check_python
      shell: bash
      run: |
        if command -v python >/dev/null 2>&1 && python -c "import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)" >/dev/null 2>&1; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Python
      if: steps.check_python.outputs.found != 'true'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"

    - name: Install SecAgent
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_AGENT_ENTRYPOINT: ${{ inputs.agent_entrypoint }}
      run: |
        INPUT_AGENT_ENTRYPOINT="${INPUT_AGENT_ENTRYPOINT#"${INPUT_AGENT_ENTRYPOINT%%[![:space:]]*}"}"
        INPUT_AGENT_ENTRYPOINT="${INPUT_AGENT_ENTRYPOINT%"${INPUT_AGENT_ENTRYPOINT##*[![:space:]]}"}"
        if ! command -v secagent >/dev/null 2>&1; then
          python -m pip install --upgrade pip
          if [ -n "$INPUT_AGENT_ENTRYPOINT" ]; then
            pip install -e "${ACTION_PATH}[langgraph]"
          else
            pip install -e "$ACTION_PATH"
          fi
        elif [ -n "$INPUT_AGENT_ENTRYPOINT" ] && ! python -c "import langgraph" >/dev/null 2>&1; then
          pip install -e "${ACTION_PATH}[langgraph]"
        fi

    - name: Execute SecAgent Security Scan
      id: secagent_scan
      shell: bash
      env:
        INPUT_AGENT_ENTRYPOINT: ${{ inputs.agent_entrypoint }}
        INPUT_POLICIES: ${{ inputs.policies }}
        INPUT_SCENARIOS: ${{ inputs.scenarios }}
        INPUT_TRACE: ${{ inputs.trace }}
        INPUT_OUTPUT_REPORT: ${{ inputs.output_report }}
        INPUT_OUTPUT_MARKDOWN: ${{ inputs.output_markdown }}
        INPUT_OUTPUT_SARIF: ${{ inputs.output_sarif }}
        WORK_DIR: ${{ github.workspace }}
      run: |
        export PYTHONPATH="${WORK_DIR}${PYTHONPATH:+:$PYTHONPATH}"
        INPUT_AGENT_ENTRYPOINT="${INPUT_AGENT_ENTRYPOINT#"${INPUT_AGENT_ENTRYPOINT%%[![:space:]]*}"}"
        INPUT_AGENT_ENTRYPOINT="${INPUT_AGENT_ENTRYPOINT%"${INPUT_AGENT_ENTRYPOINT##*[![:space:]]}"}"
        rm -f "$INPUT_OUTPUT_REPORT" "$INPUT_OUTPUT_MARKDOWN"
        if [ -n "$INPUT_OUTPUT_SARIF" ]; then
          rm -f "$INPUT_OUTPUT_SARIF"
        fi
        ARGS=(
          --policies "$INPUT_POLICIES"
          --output-report "$INPUT_OUTPUT_REPORT"
          --output-markdown "$INPUT_OUTPUT_MARKDOWN"
        )
        if [ -n "$INPUT_AGENT_ENTRYPOINT" ]; then
          ARGS+=(--agent "$INPUT_AGENT_ENTRYPOINT")
        fi
        if [ -n "$INPUT_SCENARIOS" ]; then
          ARGS+=(--scenarios "$INPUT_SCENARIOS")
        fi
        if [ -n "$INPUT_TRACE" ]; then
          ARGS+=(--trace "$INPUT_TRACE")
        fi
        if [ -n "$INPUT_OUTPUT_SARIF" ]; then
          ARGS+=(--output-sarif "$INPUT_OUTPUT_SARIF")
        fi
        set +e
        secagent scan "${ARGS[@]}"
        SCAN_EXIT_CODE=$?
        set -e
        REPORT_STATUS="FAIL"
        if [ -f "$INPUT_OUTPUT_REPORT" ]; then
          REPORT_STATUS=$(python -c 'import json, pathlib, sys; print(json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")).get("status") or "FAIL")' "$INPUT_OUTPUT_REPORT" 2>/dev/null || echo "FAIL")
        fi
        if [ "$SCAN_EXIT_CODE" -ne 0 ] && [ "$REPORT_STATUS" = "PASS" ]; then
          REPORT_STATUS="FAIL"
        elif [ "$SCAN_EXIT_CODE" -eq 0 ] && [ "$REPORT_STATUS" = "FAIL" ]; then
          REPORT_STATUS="WARN"
        fi
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "$INPUT_OUTPUT_MARKDOWN" ]; then
          cat "$INPUT_OUTPUT_MARKDOWN" >> "$GITHUB_STEP_SUMMARY"
        fi
        {
          printf 'report_path<<SECAGENT_EOF\n%s\nSECAGENT_EOF\n' "$INPUT_OUTPUT_REPORT"
          printf 'markdown_path<<SECAGENT_EOF\n%s\nSECAGENT_EOF\n' "$INPUT_OUTPUT_MARKDOWN"
          printf 'sarif_path<<SECAGENT_EOF\n%s\nSECAGENT_EOF\n' "$INPUT_OUTPUT_SARIF"
          echo "status=$REPORT_STATUS"
        } >> "$GITHUB_OUTPUT"

    - name: Post PR Security Triage Comment
      if: inputs.post_comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        COMMENT_PATH: ${{ inputs.output_markdown }}
      with:
        script: |
          const fs = require('fs');
          const commentPath = process.env.COMMENT_PATH || 'comment.md';
          if (fs.existsSync(commentPath)) {
            const body = fs.readFileSync(commentPath, 'utf8');
            const marker = '<!-- secagent-security-gate -->';
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: body
                });
              }
            } catch (err) {
              core.warning(`Could not post PR triage comment (e.g., fork PR read-only token): ${err.message}`);
            }
          }

    - name: Enforce Security Gate Verdict
      if: always()
      shell: bash
      env:
        SCAN_STATUS: ${{ steps.secagent_scan.outputs.status }}
      run: |
        if [ "$SCAN_STATUS" = "WARN" ]; then
          echo "::warning::SecAgent scan completed with non-blocking policy warnings."
        elif [ "$SCAN_STATUS" != "PASS" ]; then
          echo "::error::SecAgent security gate did not pass (status: ${SCAN_STATUS:-UNKNOWN})."
          exit 1
        fi
