name: "SecAgent Security Scan"
description: "Run invariant security checks on autonomous AI agent execution traces in CI/CD"
author: "SecAgent Team"

branding:
  icon: "shield"
  color: "blue"

inputs:
  agent_entrypoint:
    description: "Import path or executable for target agent (LangGraph-first, or any agent emitting standard OTel traces)"
    required: false
    default: ""
  policies:
    description: "Path to security rules YAML file"
    required: false
    default: "policies/security_rules.yaml"
  scenarios:
    description: "Optional path to scenarios directory. If omitted, scenarios are generated dynamically."
    required: false
    default: ""
  output_report:
    description: "Path to output JSON audit report"
    required: false
    default: "report.json"
  output_markdown:
    description: "Path to output markdown comment summary"
    required: false
    default: "comment.md"
  post_comment:
    description: "Post PR triage comment from output_markdown on pull_request events"
    required: false
    default: "true"

outputs:
  status:
    description: "Scan verdict (PASS or FAIL)"
    value: ${{ steps.secagent_scan.outputs.status }}
  report_path:
    description: "Path to generated JSON audit report"
    value: ${{ steps.secagent_scan.outputs.report_path }}
  markdown_path:
    description: "Path to generated Markdown comment summary"
    value: ${{ steps.secagent_scan.outputs.markdown_path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install SecAgent
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if ! command -v secagent >/dev/null 2>&1; then
          python -m pip install --upgrade pip
          pip install -e "$ACTION_PATH"
        fi

    - name: Execute SecAgent Security Scan
      id: secagent_scan
      shell: bash
      env:
        INPUT_AGENT_ENTRYPOINT: ${{ inputs.agent_entrypoint }}
        INPUT_POLICIES: ${{ inputs.policies }}
        INPUT_SCENARIOS: ${{ inputs.scenarios }}
        INPUT_OUTPUT_REPORT: ${{ inputs.output_report }}
        INPUT_OUTPUT_MARKDOWN: ${{ inputs.output_markdown }}
        PYTHONPATH: ${{ github.workspace }}
      run: |
        ARGS=(
          --agent "$INPUT_AGENT_ENTRYPOINT"
          --policies "$INPUT_POLICIES"
          --output-report "$INPUT_OUTPUT_REPORT"
          --output-markdown "$INPUT_OUTPUT_MARKDOWN"
        )
        if [ -n "$INPUT_SCENARIOS" ]; then
          ARGS+=(--scenarios "$INPUT_SCENARIOS")
        fi
        set +e
        secagent scan "${ARGS[@]}"
        SCAN_EXIT_CODE=$?
        set -e
        {
          echo "report_path=$INPUT_OUTPUT_REPORT"
          echo "markdown_path=$INPUT_OUTPUT_MARKDOWN"
          if [ "$SCAN_EXIT_CODE" -eq 0 ]; then
            echo "status=PASS"
          else
            echo "status=FAIL"
          fi
        } >> "$GITHUB_OUTPUT"

    - name: Post PR Security Triage Comment
      if: inputs.post_comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        COMMENT_PATH: ${{ inputs.output_markdown }}
      with:
        script: |
          const fs = require('fs');
          const commentPath = process.env.COMMENT_PATH || 'comment.md';
          if (fs.existsSync(commentPath)) {
            const body = fs.readFileSync(commentPath, 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          }

    - name: Enforce Security Gate Verdict
      if: always()
      shell: bash
      env:
        SCAN_STATUS: ${{ steps.secagent_scan.outputs.status }}
      run: |
        if [ "$SCAN_STATUS" != "PASS" ]; then
          echo "::error::SecAgent security gate failed: policy violations detected."
          exit 1
        fi
