name: SecAgent Security Gate & Contract Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  security-and-contract-tests:
    name: OWASP Policy Invariants & Action Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Linters & Formatting Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Contract & Regression Tests
        run: |
          pytest tests/ -v

      - name: Run SecAgent Dynamic Security Scan
        id: secagent_scan
        run: |
          secagent scan \
            --policies policies/security_rules.yaml \
            --output-report report.json \
            --output-markdown comment.md

      - name: Post PR Security Triage Comment
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('comment.md')) {
              const body = fs.readFileSync('comment.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
