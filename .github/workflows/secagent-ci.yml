name: SecAgent Security Gate & Contract Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  security-and-contract-tests:
    name: OWASP Policy Invariants & Action Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Linters & Formatting Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Contract & Regression Tests
        run: |
          pytest tests/ -v

      - name: Run SecAgent Dynamic Security Scan
        id: secagent_scan
        uses: ./
        with:
          agent_entrypoint: "examples.devops_agent.agent"
          policies: "policies/security_rules.yaml"
          output_report: "report.json"
          output_markdown: "comment.md"
