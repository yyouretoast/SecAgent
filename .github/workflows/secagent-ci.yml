name: SecAgent Security Gate & Contract Tests

on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-contract-tests:
    name: OWASP Policy Invariants & Action Gate (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run Linters & Formatting Check
        run: |
          ruff check .
          ruff format --check .
          mypy src/secagent

      - name: Run Contract & Regression Tests
        run: |
          pytest tests/ -v

      - name: Run SecAgent Dynamic Security Scan
        id: secagent_scan
        uses: ./
        with:
          agent_entrypoint: "examples.finance_agent.agent:app"
          policies: "policies/security_rules.yaml"
          output_report: "report.json"
          output_markdown: "comment.md"
          output_sarif: "report.sarif"

      - name: Verify Vulnerable Agent Blocks Security Gate
        run: |
          rm -f vuln_ci_report.json vuln_ci_comment.md vuln_ci.sarif
          set +e
          secagent scan \
            --agent examples.finance_agent.agent:vulnerable_app \
            --policies policies/security_rules.yaml \
            --output-report vuln_ci_report.json \
            --output-markdown vuln_ci_comment.md \
            --output-sarif vuln_ci.sarif
          CODE=$?
          set -e
          if [ "$CODE" -ne 1 ]; then
            echo "::error::Expected vulnerable_app scan to fail with exit code 1, got $CODE"
            exit 1
          fi
          python -c 'import json, pathlib; r = json.loads(pathlib.Path("vuln_ci_report.json").read_text(encoding="utf-8")); status = r.get("status"); count = int(r.get("violations_detected", 0)); assert status == "FAIL" and count > 0, f"Unexpected negative gate report: status={status}, violations={count}"'

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && matrix.python-version == '3.11' && hashFiles('report.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          sarif_file: report.sarif

  gate-summary:
    name: OWASP Policy Invariants & Action Gate
    runs-on: ubuntu-latest
    needs: [security-and-contract-tests]
    if: always()
    steps:
      - name: Verify All Python Matrix Jobs Passed
        env:
          MATRIX_RESULT: ${{ needs.security-and-contract-tests.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::Matrix job result was '$MATRIX_RESULT' (expected 'success')"
            exit 1
          fi
