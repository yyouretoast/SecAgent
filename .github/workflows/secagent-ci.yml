name: SecAgentTwin Continuous Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  differential-security-audit:
    name: Differential Trace & OWASP Policy Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run SecAgentTwin Regression Audit
        id: secagent_audit
        run: |
          secagent test \
            --baseline baselines/golden/ \
            --scenarios scenarios/ \
            --policies policies/security_rules.yaml \
            --output-report report.json \
            --output-markdown comment.md

      - name: Post PR Diagnostic Diff Comment
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('comment.md')) {
              const body = fs.readFileSync('comment.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
