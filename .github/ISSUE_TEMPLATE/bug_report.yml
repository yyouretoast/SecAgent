name: Bug Report
description: Report a bug in SecAgent CLI, policy engine, harness, telemetry, or GitHub Action
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps / CLI Command
      description: Exact command, agent entrypoint, or trace snippet to reproduce the issue.
      placeholder: |
        secagent scan --agent examples.finance_agent.agent:vulnerable_app
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs. Actual Behavior
      description: What you expected to happen and what actually occurred.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, and SecAgent version or commit SHA.
      placeholder: |
        - OS: Ubuntu 24.04 / Windows 11
        - Python: 3.11
        - SecAgent: 0.1.0
    validations:
      required: true
